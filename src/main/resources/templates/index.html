<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Správa Kontaktov</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 40px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>
<h1> Môj zoznam kontaktov</h1>
<p>Vitajte v prvej skutočnej webovej aplikácii!</p>

<div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
    <h3>➕ Pridať nový kontakt</h3>
    <form th:action="@{/pridat}" method="post" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" name="meno" placeholder="Meno a priezvisko" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
        <input type="text" name="telefon" placeholder="Telefónne číslo" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
        <input type="email" name="email" placeholder="E-mailová adresa" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Uložiť kontakt</button>
    </form>
</div>
<table>
    <thead>
        <tr>
        <th>ID</th>
        <th>Meno</th>
        <th>Telefon</th>
        <th>E-mail</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="k, rowStat : ${kontaktyNaWebe}">
        <!-- Tieto políčka zostávajú rovnaké -->
        <td th:text="${rowStat.count}">1</td>

        <!-- ZMENA: Forma na úpravu priamo v riadku tabuľky -->
        <td colspan="3" style="padding: 0;">
            <!-- Každý riadok bude malý formulár, ktorý pošle dáta na náš REST API -->
            <form th:action="@{/upravit/{id}(id=${k.id})}" method="post" style="display: flex; width: 100%; gap: 5px; padding: 5px;">
                <!-- Skrytý trik pre Thymeleaf, aby prehliadač vedel, že posielame PUT, nie POST -->
                <input type="hidden" name="_method" value="put"/>

                <input type="text" name="meno" th:value="${k.meno}" required style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
                <input type="text" name="telefon" th:value="${k.telefon}" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
                <input type="email" name="email" th:value="${k.email}" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">

                <button type="submit" style="background-color: #008CBA; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">📝 Uložiť zmenu</button>
            </form>
        </td>
    </tr>
    </tbody>
    </table>
</body>
</html>
